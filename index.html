 S={n:n,cl:c,end:Date.now()+MINUTES*60000,
  a:shuf(P1.map(function(q,i){return i})).map(function(i){var o=shuf([0,1,2,3]);return{i:i,o:o,v:-1}}),
  b:shuf([0,1]).map(function(i){return{i:i,o:shuf([0,1,2,3]),v:[-1,-1,-1,-1]}}),
  c:shuf([0,1,2,3]).map(function(i){return{i:i,v:""}})};
 $("who").textContent=n+" – "+c;buildExam();show("exam");tick();timer=setInterval(tick,1000)}
function buildExam(){
 var h="",k=0,L="ABCD";
 h+='<div class="part">PHẦN I. Trắc nghiệm nhiều lựa chọn (18 câu)</div>';
 S.a.forEach(function(x,p){k++;h+='<div class="card q"><div class="st">Câu '+k+'. '+esc(P1[x.i][0])+'</div>';
  x.o.forEach(function(oi,j){h+='<label class="opt" data-a="'+p+'" data-j="'+j+'"><input type="radio" name="a'+p+'">'+L[j]+'. '+esc(P1[x.i][1][oi])+'</label>'});h+='</div>'});
 k=0;h+='<div class="part">PHẦN II. Trắc nghiệm đúng – sai (4 câu)</div>';
 S.b.forEach(function(x,p){k++;h+='<div class="card q"><div class="st">Câu '+k+'. '+esc(P2[x.i][0])+'</div>';
  x.o.forEach(function(oi,j){h+='<div class="tf"><span class="t"><b>'+"abcd"[j]+')</b> '+esc(P2[x.i][1][oi])+'</span><button data-b="'+p+'" data-j="'+j+'" data-v="1">Đúng</button><button data-b="'+p+'" data-j="'+j+'" data-v="0">Sai</button></div>'});h+='</div>'});
 k=0;h+='<div class="part">PHẦN III. Trả lời ngắn (6 câu)</div>';
 S.c.forEach(function(x,p){k++;h+='<div class="card q"><div class="st">Câu '+k+'. '+esc(P3[x.i][0])+'</div><input type="text" inputmode="decimal" data-c="'+p+'" placeholder="Nhập đáp số"></div>'});
 $("qs").innerHTML=h;count()}
$("qs").addEventListener("click",function(e){
 var o=e.target.closest(".opt");
 if(o){var p=+o.dataset.a;S.a[p].v=+o.dataset.j;o.parentNode.querySelectorAll(".opt").forEach(function(z){z.classList.toggle("sel",z===o)});count();return}
 var b=e.target.closest("button[data-b]");
 if(b){var p=+b.dataset.b,j=+b.dataset.j;S.b[p].v[j]=+b.dataset.v;b.parentNode.querySelectorAll("button").forEach(function(z){z.classList.toggle("on",z===b)});count()}});
$("qs").addEventListener("input",function(e){var t=e.target;if(t.dataset.c!==undefined){S.c[+t.dataset.c].v=t.value;count()}});
function count(){var d=S.a.filter(function(x){return x.v>=0}).length+S.b.reduce(function(s,x){return s+x.v.filter(function(v){return v>=0}).length},0)+S.c.filter(function(x){return String(x.v).trim()}).length;$("cnt").textContent="Đã trả lời: "+d+" / 18 + 16 ý + 6 câu"}
function tick(){var r=Math.max(0,Math.round((S.end-Date.now())/1000));$("tm").textContent="⏱ "+String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");$("bar").classList.toggle("warn",r<300);if(r<=0)finish()}
$("sub").onclick=function(){confirmBox("Bạn chắc chắn muốn nộp bài?",finish)};
function num(s){var t=String(s).replace(/%/g,"").replace(/\s/g,"").replace(",",".");return t===""?NaN:parseFloat(t)}
function finish(){
 if(!S||S.done)return;S.done=true;clearInterval(timer);
 var s1=0,s2=0,s3=0,d1=0,d3=0,d2=[];
 S.a.forEach(function(x){if(x.o[x.v]===P1[x.i][2]){s1+=PTS.p1;d1++}});
 S.b.forEach(function(x){var ok=0;x.o.forEach(function(oi,j){if(x.v[j]===P2[x.i][2][oi])ok++});d2.push(ok);s2+=PTS.p2*PART2[ok]});
 S.c.forEach(function(x){var v=num(x.v);if(!isNaN(v)&&Math.abs(v-P3[x.i][1])<1e-6){s3+=PTS.p3;d3++}});
 var tot=Math.round((s1+s2+s3)*100)/100,g=grade(tot);
 var r={id:QUIZ_ID+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),quiz:QUIZ_ID,n:S.n,c:S.cl,s:tot,g:g,p1:s1,p2:Math.round(s2*100)/100,p3:s3,t:new Date().toLocaleString("vi-VN"),ts:Date.now(),sent:false};
 // Ghi xuống máy trước, rồi mới gửi mạng: mất mạng không làm mất bài.
 var all=localResults();all.push(r);writeResults(all);sendResult(r);
 $("sc").textContent=tot.toFixed(2).replace(".",",")+" / 10";$("gr").textContent="Xếp loại: "+g;
 $("det").innerHTML="<p>Phần I: <b>"+d1+"/18</b> câu đúng ("+s1.toFixed(2)+" đ)</p><p>Phần II: đúng <b>"+d2.join(" và ")+"</b> ý ở mỗi câu ("+r.p2.toFixed(2)+" đ)</p><p>Phần III: <b>"+d3+"/6</b> câu đúng ("+s3.toFixed(2)+" đ)</p>";
 S=null;show("res")}
$("back").onclick=function(){$("nm").value="";$("cl").value="";show("home")};
// ===== GIÁO VIÊN =====
$("tch").onclick=function(){$("pw").value="";$("perr").textContent="";show("tp")};
$("pback").onclick=function(){show("home")};
$("plog").onclick=function(){if($("pw").value===TEACHER_PW){show("td");dash();renderQR()}else $("perr").textContent="Sai mật khẩu."};
$("tout").onclick=function(){if(dashTimer){clearInterval(dashTimer);dashTimer=null}show("home")};
$("refresh").onclick=function(){refreshDash()};
function refreshDash(){
 if(dashBusy)return;
 dashBusy=true;
 var local=localResults();
 syncPending().then(function(){return loadRemoteResults()}).then(function(remote){
  var all=mergeResults(remote),ranked=all.slice().sort(function(a,b){return b.s-a.s||((a.ts||0)-(b.ts||0))}),cnt={};
  GR.forEach(function(g){cnt[g]=0});all.forEach(function(r){cnt[r.g]++});
  $("tot").textContent="("+all.length+" bài"+(endpoint()?" · đã đồng bộ":" · chỉ trên máy này")+")";
 $("dist").innerHTML=GR.map(function(g){var p=all.length?cnt[g]*100/all.length:0;return'<div class="gb"><span class="n">'+g+'</span><div class="tr"><div class="f" style="width:'+p+'%"></div></div><span class="v">'+p.toFixed(1)+'% ('+cnt[g]+')</span></div>'}).join("");
 $("rank").innerHTML=ranked.slice(0,10).map(function(r,i){return'<li><span class="pos">'+(i+1)+'</span><span class="student"><b>'+esc(r.n)+'</b><small>'+esc(r.c)+' · '+esc(r.g)+'</small></span><span class="mark">'+r.s.toFixed(2)+'/10</span></li>'}).join("")||'<li>Chưa có dữ liệu xếp hạng.</li>';
 $("rows").innerHTML=ranked.map(function(r,i){return"<tr><td>"+(i+1)+"</td><td>"+esc(r.n)+"</td><td>"+esc(r.c)+"</td><td><b>"+r.s.toFixed(2)+"</b></td><td>"+esc(r.g)+"</td><td>"+esc(r.t)+"</td></tr>"}).join("")||'<tr><td colspan="6">Chưa có bài nộp.</td></tr>';
  dashBusy=false;
 }).catch(function(){
  // Nếu endpoint tạm lỗi, vẫn hiển thị bản cục bộ thay vì làm hỏng trang giáo viên.
  $("tot").textContent="("+local.length+" bài · ngoại tuyến)";
  dashBusy=false;
 })}
function dash(){refreshDash();if(!dashTimer)dashTimer=setInterval(refreshDash,5000)}
function clearDashboardView(){
 if(dashTimer){clearInterval(dashTimer);dashTimer=null}
 $("tot").textContent="(0 bài · đã xóa trên thiết bị này)";
 $("dist").innerHTML=GR.map(function(g){return'<div class="gb"><span class="n">'+g+'</span><div class="tr"><div class="f" style="width:0%"></div></div><span class="v">0.0% (0)</span></div>'}).join("");
 $("rank").innerHTML='<li>Chưa có dữ liệu xếp hạng.</li>';
 $("rows").innerHTML='<tr><td colspan="6">Chưa có bài nộp.</td></tr>';
}
$("csv").onclick=function(){
 var all=localResults();if(endpoint())loadRemoteResults().then(function(remote){all=mergeResults(remote);downloadCsv(all)});else downloadCsv(all);
 function downloadCsv(all){
  if(!all.length)return;function csvCell(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
  var t="\uFEFFSTT,Họ tên,Lớp,Phần I,Phần II,Phần III,Tổng điểm,Xếp loại,Thời gian nộp\n"+all.map(function(r,i){return[i+1,r.n,r.c,r.p1,r.p2,r.p3,r.s,r.g,r.t].map(csvCell).join(",")}).join("\n");
  var a=document.createElement("a"),u=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.href=u;a.download="ket-qua-hoa10-chuong1.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)
 }
};
$("rst").onclick=function(){confirmBox("Xóa toàn bộ kết quả cũ trên Google Sheet và thiết bị này? Không thể hoàn tác.",function(){
 // Xóa local trước để thao tác luôn có hiệu lực trên thiết bị đang dùng.
 writeResults([]);clearDashboardView();
 clearRemoteResults().then(function(ok){
  if(ok){alert("Đã xóa dữ liệu cũ trên Google Sheet và thiết bị này.")}
  else{alert("Đã xóa dữ liệu trên thiết bị này. Google Sheet chưa xác nhận được việc xóa; hãy triển khai lại apps-script.gs rồi bấm Cập nhật ngay.")}
 })
})};
renderQR();
</script>
